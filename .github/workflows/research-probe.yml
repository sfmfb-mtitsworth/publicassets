name: Research probe (one-off)
on:
  push:
    branches: [research-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q openpyxl==3.1.5 && python research/probe.py
